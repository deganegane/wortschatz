name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK (for the phone) and AAB (for Play Console)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon --stacktrace

      - name: Rename outputs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Wortschatz.apk
          cp app/build/outputs/bundle/release/app-release.aab Wortschatz.aab

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wortschatz
          path: |
            Wortschatz.apk
            Wortschatz.aab

      - name: Publish release with APK (easy download on phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Wortschatz – build ${{ github.run_number }}
          files: |
            Wortschatz.apk
            Wortschatz.aab
